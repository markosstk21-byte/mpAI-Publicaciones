name: Publicar carrusel del día

on:
  schedule:
    # 12:05 UTC = 14:05 en España (horario de verano) / 13:05 (horario de invierno).
    # Se evita el minuto en punto (12:00) porque GitHub avisa de que es la hora de mayor
    # carga de todo Actions y los cron ahí sufren más retraso. El 10-sep-2026 el disparador
    # de las 12:00 UTC no llegó a saltar en unos 45 minutos; con el minuto 5 se evita ese pico.
    - cron: "5 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BASE_URL: ${{ vars.BASE_URL }}
          PUBLICAR_DE_VERDAD: ${{ vars.PUBLICAR_DE_VERDAD }}
        run: python publicar.py

      - name: Guardar el registro
        run: |
          if [[ -n "$(git status --porcelain registro.json)" ]]; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add registro.json
            git commit -m "Registro de la publicacion del $(date +%F)"
            git push
          fi
